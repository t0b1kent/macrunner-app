name: MacRunner 1.1.1 application source stages Xcode27 ARM64
# Build the selected c33r application and helpers from their public source recipe.
# Whole-application assembly is dispatched only after its new component inputs are pinned.
on:
  workflow_dispatch:
    inputs:
      group:
        description: sources = the five stages of the application source; steps = engine tools and bottle catalogues
        type: choice
        options: [sources, steps, application]
        default: sources
permissions:
  contents: read
  actions: read
jobs:
  stage:
    if: ${{ inputs.group == 'sources' || inputs.group == 'application' }}
    runs-on: xcode-27
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: ${{ fromJSON(inputs.group == 'application' && '["offline-normal","offline-optimized","native-fullmode"]' || '["offline-normal","offline-optimized","sparkle","plcrashreporter","native-fullmode"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: arm64
      - name: Offline recipe tests
        if: startsWith(matrix.stage, 'offline-')
        shell: bash
        run: |
          set -euo pipefail
          export REPRO109_TEST_TMP="$RUNNER_TEMP/repro110-app-tests"
          mkdir -p "$REPRO109_TEST_TMP"
          flags=(-I -B)
          if [ '${{ matrix.stage }}' = offline-optimized ]; then flags+=(-O); fi
          python3 "${flags[@]}" -m unittest discover -s build/repro110app -p 'test_*.py'
          python3 -I -B build/repro110app/build_source.py --plan
          python3 -I -B build/repro110app/build_engine_tools.py --plan
          python3 -I -B build/repro110app/bottle_catalogues.py --plan
      - name: Source component or full producer
        if: ${{ !startsWith(matrix.stage, 'offline-') }}
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/repro110-app-results"
          mkdir -p "$results"
          if [ '${{ matrix.stage }}' = native-fullmode ]; then
            nice -n 20 python3 -I -B build/repro110app/build_source.py --build \
              --work "$RUNNER_TEMP/repro110-app-source" --publish-dir "$results" --jobs 2 --minutes 100
          else
            nice -n 20 python3 -I -B build/repro110app/build_app_frameworks.py --build \
              --only '${{ matrix.stage }}' --work "$RUNNER_TEMP/repro110-app-source" \
              --publish-dir "$results" --jobs 2 --minutes 90
          fi
      - name: Preserve executable modes and framework symlinks in the source application
        if: matrix.stage == 'native-fullmode'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/app-prefix.tar.gz" -C "$RUNNER_TEMP/repro110-app-source/prefix" .
          shasum -a 256 "$RUNNER_TEMP/app-prefix.tar.gz" > "$RUNNER_TEMP/app-prefix.tar.gz.sha256"
      - name: Preserve raw reports and produced prefix on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro110-app-source-${{ matrix.stage }}
          path: |
            ${{ runner.temp }}/repro110-app-results
            ${{ runner.temp }}/repro110-app-source/reports
            ${{ runner.temp }}/repro110-app-source/frameworks/reports
            ${{ runner.temp }}/repro110-app-source/prefix
            ${{ runner.temp }}/app-prefix.tar.gz*
          if-no-files-found: warn
          retention-days: 30
  steps:
    if: ${{ inputs.group == 'steps' }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        step: [engine-tools, bottle-catalogues]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: arm64
      - name: Run the recipe step
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repro110-step-${{ matrix.step }}"
          if [ '${{ matrix.step }}' = engine-tools ]; then
            nice -n 20 python3 -I -B build/repro110app/build_engine_tools.py --build --work "$work"
          else
            python3 -I -B build/repro110app/bottle_catalogues.py --check --work "$work"
          fi
      - name: Preserve the step results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro110-app-step-${{ matrix.step }}
          path: ${{ runner.temp }}/repro110-step-${{ matrix.step }}
          if-no-files-found: warn
          retention-days: 30
