name: REPRO-110 PLCrashReporter recipe edit check

# The bisect (run 38501023892) showed that the Xcode build service survives the pinned PLCrashReporter project once the
# protobuf source is removed from the static library's Sources phase. This job applies the recipe's own edit module
# (build/repro109app/plc_project_edit.py, which refuses any project file but the pinned 318366 bytes) to a fresh checkout
# of the pinned revision and builds the same targets and with the same arguments as the producer. It publishes nothing
# but logs, the edit report and the product hashes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: framework, runner: macos-26, developer_dir: /Applications/Xcode_26.6.app/Contents/Developer, target: CrashReporter macOS Framework}
          - {variant: framework, runner: xcode-27, developer_dir: /Applications/Xcode_27.app/Contents/Developer, target: CrashReporter macOS Framework}
          - {variant: static-library, runner: macos-26, developer_dir: /Applications/Xcode_26.6.app/Contents/Developer, target: CrashReporter macOS}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      PLC_REVISION: 6752f71de206f6a53fa6a758c3660fd9a7fe7527
      PLC_TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout the recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the pinned PLCrashReporter revision
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/plc-source"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/microsoft/plcrashreporter.git "$PLC_REVISION"
          git -C "$src" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$PLC_REVISION" ] || { printf 'Revision differs\n'; exit 1; }
          [ -z "$(git -C "$src" status --porcelain)" ]
      - name: Apply the recipe edit (refuses any project file but the pinned one)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/plc-check/${VARIANT}-${{ matrix.runner }}"
          mkdir -p "$out"
          python3 -I -B - "$GITHUB_WORKSPACE/build/repro109app/plc_project_edit.py" "$RUNNER_TEMP/plc-source/CrashReporter.xcodeproj/project.pbxproj" "$out/project-edit.json" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('plc_project_edit', sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          path = Path(sys.argv[2])
          edited, report = module.apply(path.read_bytes())
          path.write_bytes(edited)
          Path(sys.argv[3]).write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
          plutil -lint "$RUNNER_TEMP/plc-source/CrashReporter.xcodeproj/project.pbxproj"
          git -C "$RUNNER_TEMP/plc-source" status --porcelain | tee "$out/post-edit-status.txt"
      - name: Build with the exact producer arguments
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/plc-check/${VARIANT}-${{ matrix.runner }}"
          xcodebuild -version > "$out/xcode-version.txt" 2>&1
          xcodebuild -project "$RUNNER_TEMP/plc-source/CrashReporter.xcodeproj" -target "$PLC_TARGET" \
            -configuration Release -sdk macosx -jobs 4 ARCHS=arm64 ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            SYMROOT="$RUNNER_TEMP/plc-build/products" OBJROOT="$RUNNER_TEMP/plc-build/objects" build \
            > "$out/xcodebuild.log" 2>&1
          rc=$?
          verdict="$(grep -E 'BUILD (SUCCEEDED|FAILED)|build system has crashed' "$out/xcodebuild.log" | tr '\n' ' ' | head -c 300)"
          printf 'rc=%s\n%s\n' "$rc" "$verdict" > "$out/result.txt"
          printf '| %s | %s | rc %s | %s |\n' "$VARIANT" "${{ matrix.runner }}" "$rc" "$verdict" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Record the products
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/plc-check/${VARIANT}-${{ matrix.runner }}"
          find "$RUNNER_TEMP/plc-build/products" -type f \( -name 'CrashReporter' -o -name '*.a' \) -exec shasum -a 256 {} \; > "$out/products.sha256" 2>&1
          find "$RUNNER_TEMP/plc-build/products" -type f \( -name 'CrashReporter' -o -name '*.a' \) -exec lipo -archs {} \; > "$out/products.archs" 2>&1
          git -C "$RUNNER_TEMP/plc-source" status --porcelain > "$out/final-status.txt" 2>&1
          ls -la "$HOME/Library/Logs/DiagnosticReports" > "$out/listing-user.txt" 2>&1
          cat "$out/products.sha256" "$out/products.archs" "$out/result.txt" 2>&1 | head -20
      - name: Preserve the variant result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro110-plc-fix-check-${{ matrix.variant }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/plc-check/${{ matrix.variant }}-${{ matrix.runner }}/
          if-no-files-found: error
          retention-days: 30
